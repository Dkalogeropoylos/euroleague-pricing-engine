name: EuroLeague Data Refresh

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'bootstrap (historical seasons) or daily (latest season only)'
        required: true
        type: choice
        default: daily
        options:
          - bootstrap
          - daily
      season:
        description: 'For bootstrap choose ONE season: 2026 to repair current data, then 2025, 2024, 2023'
        required: false
        type: choice
        default: '2026'
        options:
          - '2026'
          - '2025'
          - '2024'
          - '2023'
  schedule:
    # 06:37 Athens winter / 07:37 Athens summer; GitHub schedule is UTC.
    - cron: '37 4 * * *'

permissions:
  contents: write

concurrency:
  group: euroleague-data-refresh
  cancel-in-progress: false

jobs:
  fetch-and-train:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests before data update
        run: python -m pytest -q
      - name: Fetch historical data, incrementally
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'bootstrap' }}
        run: python sync_cloud.py --mode bootstrap --seasons ${{ inputs.season || '2026' }}
      - name: Fetch latest season, incrementally
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode != 'bootstrap') }}
        run: python sync_cloud.py --mode daily
      - name: Fit structural SHADOW v0.6 on complete history (when ready)
        run: |
          python - <<'PYSHADOW'
          from pathlib import Path
          import subprocess, sys
          import pandas as pd
          p = Path('data/euroleague/exports/team_games.csv')
          if p.exists():
              games = pd.read_csv(p, usecols=['GAME_ID', 'SEASON'])
              if games.GAME_ID.nunique() >= 500 and games.SEASON.nunique() >= 3:
                  subprocess.run([sys.executable, 'train_structural_v06.py'], check=True)
              else:
                  print('Shadow training skipped until 500 games and 3 seasons')
          else:
              print('Shadow training skipped: no exported data yet')
          PYSHADOW
      - name: Fit independent pace-times-efficiency SHADOW v0.7
        run: python train_efficiency_v07.py
      - name: Independent pregame totals audit against structural v0.6
        run: python audit_totals_v07.py
      - name: Audit 90pct MC coverage - still shadow
        run: python audit_distributions_v07.py --draws 1500
      - name: Fit team-state discrimination SHADOW v0.8
        run: python train_discrimination_v08.py
      - name: Verify team-state discrimination v0.8
        run: python verify_discrimination_v08.py
      - name: Verify official-inclusive v0.6 release gate
        run: python verify_release_v06.py
      - name: Verify v0.7 settlement and model audit gates
        run: python verify_shadow_v07.py
      - name: Commit only validated exports and trained coefficients
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/euroleague/exports/
          # Stage ONLY validated, non-sensitive JSON reports. The repo may still
          # have an older .gitignore that excludes the shadow directories.
          # -f bypasses ignore rules for these exact JSON outputs, without
          # staging raw API caches or unrelated files.
          if [ -d data/euroleague/shadow_v06 ]; then
            find data/euroleague/shadow_v06 -maxdepth 1 -type f -name '*.json' -print0 | xargs -0 -r git add -f --
          fi
          if [ -d data/euroleague/shadow_v07 ]; then
            find data/euroleague/shadow_v07 -maxdepth 1 -type f -name '*.json' -print0 | xargs -0 -r git add -f --
          fi
          if [ -d data/euroleague/shadow_v08 ]; then
            find data/euroleague/shadow_v08 -maxdepth 1 -type f -name '*.json' -print0 | xargs -0 -r git add -f --
          fi
          echo 'Files staged for commit:' 
          git diff --cached --name-only
          if git diff --cached --quiet; then
            echo 'No changed exported data.'
            exit 0
          fi
          git commit -m 'data: update EuroLeague exports and structural shadow audit'
          git push
