name: EuroLeague Data Refresh

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'bootstrap (historical seasons) or daily (latest season only)'
        required: true
        type: choice
        default: daily
        options:
          - bootstrap
          - daily
  schedule:
    # 06:37 Athens winter / 07:37 Athens summer; GitHub schedule is UTC.
    - cron: '37 4 * * *'

permissions:
  contents: write

concurrency:
  group: euroleague-data-refresh
  cancel-in-progress: false

jobs:
  fetch-and-train:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests before data update
        run: python -m pytest -q
      - name: Fetch historical data, incrementally
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'bootstrap' }}
        run: python sync_cloud.py --mode bootstrap --seasons 2023 2024 2025 2026
      - name: Fetch latest season, incrementally
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode != 'bootstrap') }}
        run: python sync_cloud.py --mode daily
      - name: Commit only validated exports and trained coefficients
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/euroleague/exports/
          if git diff --cached --quiet; then
            echo 'No changed exported data.'
            exit 0
          fi
          git commit -m 'data: update EuroLeague validated games and coefficient audit'
          git push
